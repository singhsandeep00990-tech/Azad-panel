name: AZAD SMART PANEL APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable

      - name: Create fresh Android project
        run: |
          flutter create \
            --org com.azad \
            --project-name smartpanel \
            build_app

      - name: Copy Flutter app files
        run: |
          cp pubspec.yaml build_app/pubspec.yaml
          cp lib/main.dart build_app/lib/main.dart

      - name: Copy Firebase configuration
        run: |
          cp android/app/google-services.json \
             build_app/android/app/google-services.json

      - name: Set minimum Android SDK
        working-directory: build_app
        run: |
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' android/app/build.gradle

      - name: Set package name
        working-directory: build_app
        run: |
          sed -i 's/applicationId "com.azad.smartpanel.build_app"/applicationId "com.azad.smartpanel"/' android/app/build.gradle
          sed -i 's/applicationId = "com.azad.smartpanel.build_app"/applicationId = "com.azad.smartpanel"/' android/app/build.gradle

      - name: Enable Firebase Google Services
        working-directory: build_app
        run: |
          sed -i '/plugins {/a\    id "com.google.gms.google-services" version "4.4.2" apply false' android/settings.gradle
          sed -i '/plugins {/a\    id "com.google.gms.google-services"' android/app/build.gradle

      - name: Get dependencies
        working-directory: build_app
        run: flutter pub get

      - name: Build APK
        working-directory: build_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: azad-smart-panel-apk
          path: build_app/build/app/outputs/flutter-apk/app-release.apk