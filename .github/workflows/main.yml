name: AZAD PANEL APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable

      - name: Create Flutter project
        run: |
          flutter create \
            --org com.azad \
            --project-name smartpanel \
            build_app

      - name: Copy app code
        run: |
          cp lib/main.dart build_app/lib/main.dart

      - name: Copy Firebase configuration
        run: |
          mkdir -p build_app/android/app
          cp android/app/google-services.json \
             build_app/android/app/google-services.json

      - name: Set Android package name
        working-directory: build_app
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle")
          s = p.read_text()

          s = s.replace(
              'applicationId "com.azad.smartpanel.build_app"',
              'applicationId "com.azad.smartpanel"'
          )

          s = s.replace(
              'applicationId = "com.azad.smartpanel.build_app"',
              'applicationId = "com.azad.smartpanel"'
          )

          p.write_text(s)
          PY

      - name: Add Firebase Gradle plugin
        working-directory: build_app
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/settings.gradle")
          s = p.read_text()

          if 'com.google.gms.google-services' not in s:
              s = s.replace(
                  'plugins {',
                  '''plugins {
              id "com.google.gms.google-services" version "4.4.2" apply false''',
                  1
              )

          p.write_text(s)

          p = Path("android/app/build.gradle")
          s = p.read_text()

          if 'com.google.gms.google-services' not in s:
              s = s.replace(
                  'plugins {',
                  '''plugins {
              id "com.google.gms.google-services"''',
                  1
              )

          p.write_text(s)
          PY

      - name: Get dependencies
        working-directory: build_app
        run: flutter pub get

      - name: Build APK
        working-directory: build_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: azad-panel-apk
          path: build_app/build/app/outputs/flutter-apk/app-release.apk