name: Flutter Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable

      - name: Create Flutter project
        run: |
          flutter create --org com.azad.smartpanel build_app

      - name: Copy app files
        run: |
          cp pubspec.yaml build_app/pubspec.yaml
          cp lib/main.dart build_app/lib/main.dart

      - name: Get dependencies
        working-directory: build_app
        run: flutter pub get

      - name: Build APK
        working-directory: build_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: smart-panel-apk
          path: build_app/build/app/outputs/flutter-apk/app-release.apk